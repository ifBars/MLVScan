name: Auto Release on Version Change

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'MLVScan.csproj'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use version from .csproj)'
        required: false
        type: string
      publish_nexus:
        description: 'Upload release packages to both Nexus Mods listings'
        required: false
        default: true
        type: boolean

env:
  NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
  NEXUS_SCHEDULE1_MOD_ID: ${{ vars.NEXUS_SCHEDULE1_MOD_ID }}
  NEXUS_SCHEDULE1_FILE_GROUP_ID: ${{ vars.NEXUS_SCHEDULE1_FILE_GROUP_ID }}
  NEXUS_TOOLS_MOD_ID: ${{ vars.NEXUS_TOOLS_MOD_ID }}
  NEXUS_TOOLS_MELON_FILE_GROUP_ID: ${{ vars.NEXUS_TOOLS_MELON_FILE_GROUP_ID }}
  NEXUS_TOOLS_BEPINEX5_FILE_GROUP_ID: ${{ vars.NEXUS_TOOLS_BEPINEX5_FILE_GROUP_ID }}
  NEXUS_TOOLS_BEPINEX6_MONO_FILE_GROUP_ID: ${{ vars.NEXUS_TOOLS_BEPINEX6_MONO_FILE_GROUP_ID }}
  NEXUS_TOOLS_BEPINEX6_IL2CPP_FILE_GROUP_ID: ${{ vars.NEXUS_TOOLS_BEPINEX6_IL2CPP_FILE_GROUP_ID }}
  NEXUS_RELEASE_DESCRIPTION: Security-focused static scanner that protects modded Unity games from malicious assemblies before they execute.

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      new-version: ${{ steps.check.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        
    - name: Check if version needs release
      id: check
      run: |
        # Fetch all tags to check for existing releases
        git fetch --tags
        
        # If manually triggered with a version, use that
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
          echo "Manual trigger with version: ${{ inputs.version }}"
          # Check if tag already exists
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists, skipping release"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi
          exit 0
        fi
        
        # Get current version from MLVScan.csproj
        CURRENT_VERSION=$(grep -oP '<Version>\K[^<]+' MLVScan.csproj)
        echo "Current version: $CURRENT_VERSION"
        
        # If manually triggered without version, use current version
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Manual trigger, using current version: $CURRENT_VERSION"
          # Check if tag already exists
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag v$CURRENT_VERSION already exists, skipping release"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi
          exit 0
        fi
        
        # Check if tag for current version already exists
        if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
          echo "Tag v$CURRENT_VERSION already exists, no release needed"
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        else
          echo "Tag v$CURRENT_VERSION does not exist, creating release"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
        
    - name: Install Mono (for ILRepack)
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-complete
    
    - name: Restore MelonLoader dependencies
      run: dotnet restore MLVScan.csproj -p:Configuration=MelonLoader
      
    - name: Build MelonLoader
      run: dotnet build MLVScan.csproj -c MelonLoader --no-restore
      
    - name: Restore BepInEx5 dependencies
      run: dotnet restore MLVScan.csproj -p:Configuration=BepInEx5
      
    - name: Build BepInEx5
      run: dotnet build MLVScan.csproj -c BepInEx5 --no-restore
      
    - name: Restore BepInEx6Mono dependencies
      run: dotnet restore MLVScan.csproj -p:Configuration=BepInEx6Mono
      
    - name: Build BepInEx6Mono
      run: dotnet build MLVScan.csproj -c BepInEx6Mono --no-restore
      
    - name: Restore BepInEx6IL2CPP dependencies
      run: dotnet restore MLVScan.csproj -p:Configuration=BepInEx6IL2CPP
      
    - name: Build BepInEx6IL2CPP
      run: dotnet build MLVScan.csproj -c BepInEx6IL2CPP --no-restore
    
    - name: Prepare Release Artifacts
      run: |
        mkdir -p release
        
        cp bin/MelonLoader/**/MLVScan.MelonLoader.dll release/
        cp bin/BepInEx5/**/MLVScan.BepInEx5.dll release/
        cp bin/BepInEx6Mono/**/MLVScan.BepInEx6.Mono.dll release/
        cp bin/BepInEx6IL2CPP/**/MLVScan.BepInEx6.IL2CPP.dll release/
        
        ls -la release/

    - name: Prepare Nexus packages
      run: |
        mkdir -p packages/schedule1/Plugins
        mkdir -p packages/tools-melon/Plugins
        mkdir -p packages/tools-bepinex5/BepInEx/patchers
        mkdir -p packages/tools-bepinex6-mono/BepInEx/patchers
        mkdir -p packages/tools-bepinex6-il2cpp/BepInEx/patchers

        cp release/MLVScan.MelonLoader.dll packages/schedule1/Plugins/
        cp release/MLVScan.MelonLoader.dll packages/tools-melon/Plugins/
        cp release/MLVScan.BepInEx5.dll packages/tools-bepinex5/BepInEx/patchers/
        cp release/MLVScan.BepInEx6.Mono.dll packages/tools-bepinex6-mono/BepInEx/patchers/
        cp release/MLVScan.BepInEx6.IL2CPP.dll packages/tools-bepinex6-il2cpp/BepInEx/patchers/

        (cd packages/schedule1 && zip -r ../MLVScan-Schedule1-v${{ needs.check-version.outputs.new-version }}.zip .)
        (cd packages/tools-melon && zip -r ../MLVScan-MelonLoader-v${{ needs.check-version.outputs.new-version }}.zip .)
        (cd packages/tools-bepinex5 && zip -r ../MLVScan-BepInEx5-v${{ needs.check-version.outputs.new-version }}.zip .)
        (cd packages/tools-bepinex6-mono && zip -r ../MLVScan-BepInEx6-Mono-v${{ needs.check-version.outputs.new-version }}.zip .)
        (cd packages/tools-bepinex6-il2cpp && zip -r ../MLVScan-BepInEx6-IL2CPP-v${{ needs.check-version.outputs.new-version }}.zip .)

        unzip -l packages/MLVScan-Schedule1-v${{ needs.check-version.outputs.new-version }}.zip
        unzip -l packages/MLVScan-MelonLoader-v${{ needs.check-version.outputs.new-version }}.zip
        unzip -l packages/MLVScan-BepInEx5-v${{ needs.check-version.outputs.new-version }}.zip
        unzip -l packages/MLVScan-BepInEx6-Mono-v${{ needs.check-version.outputs.new-version }}.zip
        unzip -l packages/MLVScan-BepInEx6-IL2CPP-v${{ needs.check-version.outputs.new-version }}.zip
        
    - name: Generate Release Notes
      id: release_notes
      run: |
        VERSION="${{ needs.check-version.outputs.new-version }}"
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        
        if [ -n "$LAST_TAG" ]; then
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -n 10)
        fi
        
        # Create release notes
        cat > release_notes.md << EOF
        ## MLVScan v$VERSION
        
        ### Changes
        
        $COMMITS
        
        ---
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/$LAST_TAG...v$VERSION
        EOF
        
        echo "Release notes generated"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.check-version.outputs.new-version }}
        name: MLVScan v${{ needs.check-version.outputs.new-version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        make_latest: true
        files: |
          release/MLVScan.MelonLoader.dll
          release/MLVScan.BepInEx5.dll
          release/MLVScan.BepInEx6.Mono.dll
          release/MLVScan.BepInEx6.IL2CPP.dll

    - name: Upload Schedule I package to Nexus Mods
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && env.NEXUSMODS_API_KEY != '' && env.NEXUS_SCHEDULE1_MOD_ID != '' && env.NEXUS_SCHEDULE1_FILE_GROUP_ID != '' }}
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ env.NEXUSMODS_API_KEY }}
        file_id: ${{ env.NEXUS_SCHEDULE1_FILE_GROUP_ID }}
        mod_id: ${{ env.NEXUS_SCHEDULE1_MOD_ID }}
        filename: packages/MLVScan-Schedule1-v${{ needs.check-version.outputs.new-version }}.zip
        version: ${{ needs.check-version.outputs.new-version }}
        display_name: MLVScan ${{ needs.check-version.outputs.new-version }}
        description: ${{ env.NEXUS_RELEASE_DESCRIPTION }}
        category: main
        archive_existing_version: true
        update_mod_version: true
        primary_mod_manager_download: true
        allow_mod_manager_download: true
        show_requirements_pop_up: false

    - name: Upload generic MelonLoader package to Nexus Mods
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && env.NEXUSMODS_API_KEY != '' && env.NEXUS_TOOLS_MOD_ID != '' && env.NEXUS_TOOLS_MELON_FILE_GROUP_ID != '' }}
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ env.NEXUSMODS_API_KEY }}
        file_id: ${{ env.NEXUS_TOOLS_MELON_FILE_GROUP_ID }}
        mod_id: ${{ env.NEXUS_TOOLS_MOD_ID }}
        filename: packages/MLVScan-MelonLoader-v${{ needs.check-version.outputs.new-version }}.zip
        version: ${{ needs.check-version.outputs.new-version }}
        display_name: MLVScan MelonLoader
        description: ${{ env.NEXUS_RELEASE_DESCRIPTION }}
        category: main
        archive_existing_version: true
        update_mod_version: true
        primary_mod_manager_download: true
        allow_mod_manager_download: true
        show_requirements_pop_up: false

    - name: Upload generic BepInEx 5 package to Nexus Mods
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && env.NEXUSMODS_API_KEY != '' && env.NEXUS_TOOLS_MOD_ID != '' && env.NEXUS_TOOLS_BEPINEX5_FILE_GROUP_ID != '' }}
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ env.NEXUSMODS_API_KEY }}
        file_id: ${{ env.NEXUS_TOOLS_BEPINEX5_FILE_GROUP_ID }}
        mod_id: ${{ env.NEXUS_TOOLS_MOD_ID }}
        filename: packages/MLVScan-BepInEx5-v${{ needs.check-version.outputs.new-version }}.zip
        version: ${{ needs.check-version.outputs.new-version }}
        display_name: MLVScan BepInEx5
        description: ${{ env.NEXUS_RELEASE_DESCRIPTION }}
        category: main
        archive_existing_version: true
        update_mod_version: true
        allow_mod_manager_download: true
        show_requirements_pop_up: false

    - name: Upload generic BepInEx 6 Mono package to Nexus Mods
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && env.NEXUSMODS_API_KEY != '' && env.NEXUS_TOOLS_MOD_ID != '' && env.NEXUS_TOOLS_BEPINEX6_MONO_FILE_GROUP_ID != '' }}
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ env.NEXUSMODS_API_KEY }}
        file_id: ${{ env.NEXUS_TOOLS_BEPINEX6_MONO_FILE_GROUP_ID }}
        mod_id: ${{ env.NEXUS_TOOLS_MOD_ID }}
        filename: packages/MLVScan-BepInEx6-Mono-v${{ needs.check-version.outputs.new-version }}.zip
        version: ${{ needs.check-version.outputs.new-version }}
        display_name: MLVScan BepInEx6 Mono
        description: ${{ env.NEXUS_RELEASE_DESCRIPTION }}
        category: main
        archive_existing_version: true
        update_mod_version: true
        allow_mod_manager_download: true
        show_requirements_pop_up: false

    - name: Upload generic BepInEx 6 IL2CPP package to Nexus Mods
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && env.NEXUSMODS_API_KEY != '' && env.NEXUS_TOOLS_MOD_ID != '' && env.NEXUS_TOOLS_BEPINEX6_IL2CPP_FILE_GROUP_ID != '' }}
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ env.NEXUSMODS_API_KEY }}
        file_id: ${{ env.NEXUS_TOOLS_BEPINEX6_IL2CPP_FILE_GROUP_ID }}
        mod_id: ${{ env.NEXUS_TOOLS_MOD_ID }}
        filename: packages/MLVScan-BepInEx6-IL2CPP-v${{ needs.check-version.outputs.new-version }}.zip
        version: ${{ needs.check-version.outputs.new-version }}
        display_name: MLVScan BepInEx6 Il2Cpp
        description: ${{ env.NEXUS_RELEASE_DESCRIPTION }}
        category: main
        archive_existing_version: true
        update_mod_version: true
        allow_mod_manager_download: true
        show_requirements_pop_up: false

    - name: Skip Nexus Mods uploads
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish_nexus) && (env.NEXUSMODS_API_KEY == '' || env.NEXUS_SCHEDULE1_FILE_GROUP_ID == '' || env.NEXUS_TOOLS_MELON_FILE_GROUP_ID == '' || env.NEXUS_TOOLS_BEPINEX5_FILE_GROUP_ID == '' || env.NEXUS_TOOLS_BEPINEX6_MONO_FILE_GROUP_ID == '' || env.NEXUS_TOOLS_BEPINEX6_IL2CPP_FILE_GROUP_ID == '') }}
      run: echo "::notice::Skipping one or more Nexus Mods uploads because the API key or a file-group variable is not configured."
        
    - name: Summary
      run: |
        echo "### ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ needs.check-version.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** v${{ needs.check-version.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
        echo "- MLVScan.MelonLoader.dll" >> $GITHUB_STEP_SUMMARY
        echo "- MLVScan.BepInEx5.dll" >> $GITHUB_STEP_SUMMARY
        echo "- MLVScan.BepInEx6.Mono.dll" >> $GITHUB_STEP_SUMMARY
        echo "- MLVScan.BepInEx6.IL2CPP.dll" >> $GITHUB_STEP_SUMMARY
